<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>JSSpeccy v4.0.0</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="jsspeccy/jsspeccy.js?v=6"></script>
    <style>
        html,
        body {
            height: 100%;
        }

        body {
            background-color: #121215;
            color: #f0f0f5;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
        }

        .header {
            text-align: center;
            padding: 24px 10px 16px 10px;
        }

        .header h1 {
            margin: 0;
            font-size: 30px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .header p {
            margin: 4px 0 0 0;
            font-size: 15px;
            color: #a0a0b0;
            font-weight: 500;
        }

        #jsspeccy {
            width: fit-content;
            max-width: 100%;
            margin: 10px auto 8px auto;
            background-color: #18181c;
            box-sizing: border-box;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
        }

        .footer {
            text-align: center;
            padding: 4px 10px 16px 10px;
            font-size: 13px;
            color: #808090;
            line-height: 1.5;
        }


        .footer a {
            color: #60a5fa;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        body.fit-to-width {
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden;
            height: 100vh !important;
            height: 100dvh !important;
        }

        body.fit-to-width .header,
        body.fit-to-width .footer {
            display: none !important;
        }

        body.fit-to-width #jsspeccy {
            width: 100% !important;
            height: 100% !important;
            max-width: 100% !important;
            max-height: 100dvh !important;
            margin: 0 !important;
            padding: 0 !important;
            border-radius: 0 !important;
            box-shadow: none !important;
            overflow: hidden;
        }
    </style>
</head>

<body onload="emu = JSSpeccy(document.getElementById('jsspeccy'), {zoom: 2, sandbox: false})">
    <header class="header">
        <h1>JSSpeccy v4.0.0</h1>
        <p>a ZX Spectrum emulator in the browser</p>
    </header>

    <div id="jsspeccy"></div>

    <footer class="footer">
        Forked & maintained by <a href="mailto:hola@alfonsoalvar.com">Alfonso Alvar</a>.
        Originally created by <a href="https://github.com/gasman/jsspeccy3" target="_blank"
            rel="noopener noreferrer">Matt Westcott</a>.
        Source code on <a href="https://github.com/alfonsoalvar/jsspeccy3" target="_blank"
            rel="noopener noreferrer">GitHub</a>.
    </footer>
</body>

</html>
